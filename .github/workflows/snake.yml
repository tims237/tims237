name: Mise à jour des images du profil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Générer la carte de statistiques
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=135,0C4A6E,312E81&title_color=22D3EE&icon_color=F472B6&text_color=FFFFFF&ring_color=22D3EE&rank_icon=github&disable_animations=true&locale=fr
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Générer la carte des langages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=135,0C4A6E,312E81&title_color=22D3EE&text_color=FFFFFF&langs_count=8&disable_animations=true&locale=fr
          path: dist/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Générer l'animation du serpent
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ec4899&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0ea5e9,#6366f1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#161b22,#0e7490,#06b6d4,#38bdf8,#818cf8

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
